<!doctype html>
<!-- PROTOTYPE - throwaway. Principle macOS app: 3-column shell + Day view, variant A.
     Not production code: no persistence, no real data, sample content only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Principle - Day view (variant A)</title>
<style>
:root{
  --page:#f6f6f6; --canvas:#fafaf8; --sidebar:#f4f3ee; --card:#fff;
  --field:#f7f7f7; --field-hover:#e8e8e8; --chip:#eff2ee;
  --text:#272523; --text-2:#55524e; --muted:#77746f; --faint:#a1a1a1;
  --accent:#09321f; --olive:#39624d; --btn:#224735; --btn-text:#eff2ee;
  --border:rgba(39,37,35,.10); --line:rgba(39,37,35,.07);
  /* Eden neutrals - eden-tokens.md §2 "Text" */
  --n900:#171717; --n800:#262626; --n700:#404040; --n600:#525252;
  --n500:#737373; --n400:#a1a1a1; --n300:#d4d4d4; --n200:#e5e5e5;
  --panel-border:rgba(0,0,0,.06); --row-hover:rgba(0,0,0,.04); --row-on:rgba(0,0,0,.06);
  --sb-shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);   /* shadow-sm */
  --float-shadow:0 22px 60px rgba(0,0,0,.08),inset 0 .5px 0 rgba(255,255,255,.6);
  --now:#c8402a;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --shadow:0 8px 20px rgba(15,23,42,.06);
  --hour:52px;
  --c1w:260px; --c3w:320px;   /* Eden's sidebar width; column 3 is ours */
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Geist,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--canvas);
  color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
/* Eden's shell: one canvas with panels floating on it at an 8px inset (sidebar.json r).
   The shell is fluid: only the two side panels have a width, column 2 takes the rest,
   and below the breakpoints at the end of this sheet each side panel becomes an overlay. */
.app{display:flex;position:relative;height:100vh;overflow:hidden;
  background:var(--canvas);padding:8px;gap:8px}

/* ---------- column 1: the Eden sidebar panel ----------
   aside [8,8,260,738] - bg #f4f3ee, r=12, 1px black/6%, shadow-sm, content width 234 (px-3) */
.col1{width:var(--c1w);flex:0 0 var(--c1w);background:var(--sidebar);border:1px solid var(--panel-border);
  border-radius:var(--r-md);box-shadow:var(--sb-shadow);
  display:flex;flex-direction:column;padding:16px 0 12px;overflow:auto;user-select:none}
/* no app name: two Eden icon buttons (36x36 r=12) switch Calendar / Inbox, at the panel's right */
.modes{display:flex;justify-content:flex-end;gap:4px;padding:0 12px 2px}
.modes button{width:36px;height:36px;border-radius:var(--r-md);color:var(--n600);
  display:flex;align-items:center;justify-content:center;transition:background-color .15s,color .15s}
.modes button:hover{background:var(--row-hover);color:var(--n900)}
.modes button.on{background:var(--row-on);color:var(--n900)}
/* the time axis now sits centred in the column-2 toolbar, like Apple Calendar */
.axis{display:inline-flex;background:rgba(39,37,35,.05);border-radius:var(--r-sm);padding:2px}
.axis button{font-size:12px;padding:5px 14px;border-radius:6px;color:var(--muted)}
.axis button.on{background:#fff;color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* section header, exactly Eden's "Chats" row: h26, 13.5/20.25, neutral-500,
   mt-3 mb-1, pl-2 pr-1, r=12; the disclosure chevron appears on hover */
.sechead{display:flex;align-items:center;height:26px;margin:12px 12px 4px;padding:0 4px 0 8px;
  border-radius:var(--r-md);font-size:13.5px;line-height:20.25px;color:var(--n500)}
.sechead .n{margin-left:auto;font-size:12px;color:var(--n400)}
.sechead.disc{gap:2px;cursor:default;transition:color .15s}
.sechead.disc:hover{color:var(--n700)}
.sechead .sp{flex:1}
/* the section's two controls sit at the panel's right edge - "+" first, the disclosure
   chevron on the very edge. Expanded, they fade in on hover; collapsed, they stay up so
   the section can be reopened without hunting for it, as Finder and Calendar do. */
.sechead .ctl{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:18px;height:18px;border-radius:5px;color:var(--n400);opacity:0;
  transition:opacity .15s,background-color .15s,color .15s,transform .15s}
.sechead .ctl:hover{background:var(--row-hover);color:var(--n700)}
.sechead .plus{font-size:15px;line-height:1;padding-bottom:1px}
.sechead .chev{font-size:9px}
.sechead .chev.shut{transform:rotate(-90deg)}
.sechead.disc:hover .ctl,.sechead.shut .ctl{opacity:1}
/* list rows: Eden's chat/board row - h30, r=12, pl-2 pr-3, gap-8, 14px, groups gap-0.5 */
.sblist{display:flex;flex-direction:column;gap:2px;padding:0 12px}
.catrow{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 8px;
  border-radius:var(--r-md);font-size:14px;color:var(--n600);cursor:default;
  transition:background-color .15s,color .15s}
.catrow:hover{background:var(--row-hover);color:var(--n900)}
.catrow.off{color:var(--n400)}
.catrow input{flex:1;min-width:0;font-size:14px;color:var(--n900);background:#fff;
  border:1.5px solid var(--btn);border-radius:6px;padding:1px 5px}
/* a plain div dressed as a macOS menu - dismissed by Esc or a click outside */
 /* Eden never opened a context menu for us to measure (eden-components.md,
   "Not opened / not captured"), so this is built from the surface tokens:
   bg card #fff, r=12, border black/6%, shadow-md, 13px rows, black/4% hover */
.menu{position:fixed;z-index:60;min-width:196px;padding:5px;font-size:13px;border-radius:var(--r-md);
  background:var(--card);border:1px solid var(--panel-border);
  box-shadow:0 8px 20px rgba(15,23,42,.10),0 1px 3px rgba(0,0,0,.06)}
.menu .it{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:8px;
  color:var(--n700);cursor:default;white-space:nowrap;transition:background-color .15s,color .15s}
.menu .it:hover{background:var(--row-hover);color:var(--n900)}
.menu .it .arw{margin-left:auto;font-size:10px;color:var(--n400)}
.menu .sep{height:1px;background:var(--n200);margin:5px 7px}
.menu .sw{display:flex;gap:7px;padding:7px 8px}
.menu .sw span{width:17px;height:17px;border-radius:50%;cursor:default;
  box-shadow:0 0 0 1px rgba(0,0,0,.10)}
.menu .sw span.on{box-shadow:0 0 0 2px var(--canvas),0 0 0 3.5px var(--btn)}
/* the principle card now opens the Inbox list */
.pod{margin:0 12px 4px;cursor:pointer}

/* mini month */
.mini{margin-top:auto;padding:16px 12px 0}
.mhead{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--text-2);padding:0 4px 6px}
.mhead .sp{flex:1}
.mnav{width:22px;height:22px;border-radius:6px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px}
.mnav:hover{background:rgba(39,37,35,.06)}
/* Apple Calendar's mini month: 12px numerals, 10px weekday letters, today a filled red
   circle with a white numeral, any other selected day a filled neutral one. 26px circles
   on the panel's 234px content width. */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;justify-items:center}
.mgrid .wd{font-size:10px;color:var(--faint);text-align:center;padding-bottom:4px}
.mgrid .d{width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  font-size:12px;border-radius:50%;color:var(--text-2);cursor:pointer;
  font-variant-numeric:tabular-nums;transition:background-color .12s,color .12s}
.mgrid .d:hover{background:rgba(39,37,35,.07)}
.mgrid .d.out{color:var(--n300)}
.mgrid .d.sel{background:var(--n600);color:#fff}
.mgrid .d.sel:hover{background:var(--n700)}
.mgrid .d.today{background:var(--now);color:#fff;font-weight:600}
.mgrid .d.today:hover{background:#b23724}

/* ---------- column 2: day ---------- */
.col2{flex:1;min-width:0;display:flex;flex-direction:column;background:transparent;position:relative}
/* toolbar: date left, time axis dead centre, date navigation right */
.dayhead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 16px 10px}
.dayhead .left{min-width:0;display:flex;align-items:center;gap:10px}
.dayhead .ttls{min-width:0}
.dayhead .h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* panel toggles: only rendered visible under the breakpoints below */
.panetog{display:none;width:28px;height:28px;flex:0 0 28px;border-radius:var(--r-sm);color:var(--n600);
  align-items:center;justify-content:center;transition:background-color .15s,color .15s}
.panetog:hover{background:var(--row-hover);color:var(--n900)}
.dayhead .right{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.dayhead .h1{font-size:21px;font-weight:500;letter-spacing:-.02em}
.dayhead .warn{font-size:12px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* date navigation lives at the top of column 3 (spec #5 rev 2) */
/* the 1fr side cells keep < Today > dead centre whatever sits beside it; "+" takes the
   right cell and opens a new task in the detail pane */
.c3head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;flex:0 0 auto;
  padding:10px 10px 9px;border-bottom:1px solid var(--panel-border)}
.c3head .nav{grid-column:2;display:flex;align-items:center;justify-content:center;gap:2px}
.c3head .add{grid-column:3;justify-self:end;width:26px;padding:0}
.navbtn{min-width:26px;height:26px;padding:0 9px;border-radius:var(--r-sm);color:var(--n600);
  display:flex;align-items:center;justify-content:center;font-size:13px;
  transition:background-color .15s,color .15s}
.navbtn:hover{background:var(--row-hover);color:var(--n900)}
.allday{display:flex;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--canvas)}
.allday .gut{width:56px;flex:0 0 56px;font-size:11px;color:var(--faint);text-align:right;padding:9px 8px 0 0}
.allday .items{flex:1;min-width:0}
.adempty{font-size:12px;color:var(--faint);padding:10px 10px}
.allday .items{display:flex;flex-wrap:wrap;gap:6px;padding:7px 10px;min-height:40px;align-content:flex-start}
.adit{display:inline-flex;align-items:center;gap:6px;max-width:250px;padding:3px 9px;border-radius:999px;
  font-size:12px;cursor:grab;user-select:none}
.adit .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gridwrap{flex:1;overflow-y:auto;position:relative}
.grid{position:relative;user-select:none}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hlab{position:absolute;left:0;width:46px;text-align:right;font-size:11px;color:var(--faint);transform:translateY(-6px)}
#lane{position:absolute;left:56px;right:0;top:0;bottom:0;border-left:1px solid var(--line);cursor:crosshair}
.band{position:absolute;left:0;right:0;display:flex;align-items:center;gap:8px;padding-left:56px;
  font-size:11px;color:var(--faint);background:rgba(39,37,35,.025);cursor:pointer;z-index:5}
.band:hover{background:rgba(39,37,35,.05);color:var(--muted)}
.foldbtn{flex:0 0 auto;margin-top:4px;font-size:12px;color:var(--muted);
  background:#fff;border:1px solid var(--border);border-radius:999px;padding:4px 12px}
.foldbtn:hover{background:var(--field)}
.nowline{position:absolute;left:46px;right:0;height:0;border-top:1.5px solid var(--now);z-index:6;pointer-events:none}
.nowline::before{content:"";position:absolute;left:0;top:-4.5px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.blk{position:absolute;border-radius:8px;padding:3px 7px;overflow:hidden;cursor:pointer}
.blk .r1{display:flex;align-items:center;gap:6px;min-width:0}
.blk .t{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk .tm{font-size:11px;opacity:.72;margin-left:19px}
.blk.done .t{text-decoration:line-through}
.blk.done{opacity:.55}
/* the selection ring is drawn INSIDE the block's own radius, never as an outline outside
   it, so a block against a column edge can't read as clipped or broken */
.blk.sel{box-shadow:inset 0 0 0 2px var(--btn)}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:6px;cursor:ns-resize}
.ghost{position:absolute;border-radius:8px;background:rgba(34,71,53,.14);border:1px dashed var(--btn);
  z-index:7;pointer-events:none;display:none}
.cb{width:15px;height:15px;border-radius:4px;border:1.5px solid currentColor;opacity:.5;flex:0 0 15px;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cb.on{opacity:1;background:currentColor}
.cb.on::after{content:"";width:7px;height:3.5px;border-left:2px solid var(--canvas);border-bottom:2px solid var(--canvas);
  transform:rotate(-45deg) translate(1px,-1px)}
.emptyview{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}

/* ---------- column 3 ---------- */
.col3{width:var(--c3w);flex:0 0 var(--c3w);background:var(--sidebar);border:1px solid var(--panel-border);
  border-radius:var(--r-md);box-shadow:var(--sb-shadow);overflow:hidden;
  display:flex;flex-direction:column}
/* the chat pane paints Eden's canvas, as it does in Eden itself */
.col3.raycol{background:var(--canvas)}
.c3body{flex:1;overflow:auto;padding:16px 12px;display:flex;flex-direction:column}
.iconbtn{min-width:26px;height:26px;padding:0 6px;border-radius:var(--r-sm);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;font-size:13px}
.iconbtn:hover{background:rgba(39,37,35,.06)}
.sec{margin-bottom:20px}
.sec .h{font-size:12px;color:var(--muted);margin-bottom:7px}
/* the day's dots, drawn as Dalio's "1 day" column: one dot per outcome, best on
   top, no labels and no numbers. Ordering mode adds titles so two dots of the
   same category can be told apart while dragging. */
.dotcol{display:flex;flex-direction:column;align-items:center;gap:7px;padding:2px 0 12px}
.dotcol.ord{align-items:stretch;gap:3px}
.dot2{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;flex:0 0 26px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1.5px var(--canvas)}
.drow{display:flex;align-items:center;gap:9px;padding:3px 4px;border-radius:var(--r-sm);cursor:grab}
.drow:hover{background:rgba(39,37,35,.04)}
.drow .t{font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow.over{box-shadow:0 -2px 0 var(--btn)}          /* drop indicator */
.dothint{font-size:11px;color:var(--faint);text-align:center;padding-top:2px}
.sugrow{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 8px;
  border-radius:var(--r-md);font-size:14px;color:var(--n600);cursor:pointer;
  transition:background-color .15s,color .15s}
.sugrow:hover{background:var(--row-hover);color:var(--n900)}
/* the same colored tick square the Categories rows carry, so a backlog row says which
   category it belongs to without a legend */
.sugrow .tick{width:15px;height:15px;flex:0 0 15px;border-radius:4px}
.sugrow .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugrow .add{margin-left:auto;font-size:12px;color:var(--n400);opacity:0}
.sugrow:hover .add{opacity:1}
/* "Must do" / "Like to do" inside the Backlog section - one step quieter than the
   section header above them */
.grph{font-size:11.5px;color:var(--faint);padding:0 8px;margin:9px 0 3px}
.sec .h + .grph{margin-top:0}
.btn{padding:6px 12px;border-radius:var(--r-sm);background:var(--field);border:1px solid var(--border);font-size:13px}
.btn:hover{background:var(--field-hover)}
.btn.primary{background:var(--btn);color:var(--btn-text);border-color:transparent;font-weight:500}
.btn.primary:hover{background:var(--accent)}
.btn.wide{width:100%}
.fld{padding:8px 2px}
.fld .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.fld input[type=text],.fld select{width:100%;padding:6px 9px;border-radius:var(--r-sm);background:var(--field);
  border:1px solid var(--border);outline:none;font-size:13px}
.fld input[type=text]:focus,.fld select:focus{border-color:var(--olive)}
.two{display:flex;gap:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden}
.seg span{font-size:12px;padding:4px 12px;color:var(--muted);cursor:pointer}
.seg span.on{background:var(--chip);color:var(--accent);font-weight:500}
.days{display:flex;gap:4px;margin-top:8px}
.days button{width:30px;height:26px;border-radius:var(--r-sm);border:1px solid var(--border);font-size:12px;color:var(--muted)}
.days button.on{background:var(--chip);border-color:transparent;color:var(--accent);font-weight:500}
.note{font-size:12px;color:var(--faint);padding:2px}
/* Ask Ray floats on the window's right margin, clear of the grid - eden.so chat tokens */
.rayfab{position:fixed;right:20px;bottom:20px;z-index:20;width:44px;height:44px;border-radius:50%;
  background:var(--btn);color:var(--btn-text);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(15,23,42,.20)}
.rayfab:hover{background:var(--accent)}
.raypanel{position:fixed;right:20px;bottom:20px;z-index:21;width:min(380px,calc(100vw - 40px));height:min(520px,calc(100vh - 40px));
  background:var(--canvas);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:0 22px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}
/* sidebar mode: the chat takes over column 3 - same slot, full height */
.col3.raycol .c3body{display:none}
.col3.raycol{padding:0}
/* ---------------------------------------------------------------------------
   Ask Ray IS Eden's chat pane. Every number below is measured, from
   VessaStudio/docs/design/eden-dom: board-chat-pane.json (pane + header),
   chat-message.json (message, bubble, actions, composer) and chat-cc.css.
   Our pane is narrow, like Eden's side peek, so the `.ai-sidepeek-chat`
   overrides in chat-cc.css are the ones that apply (bubble r=18 / 10px 15px,
   body text 14/1.65, msg-pad 14px 18px).
   --------------------------------------------------------------------------- */
/* header: pane [859,9,572,62] - h62, px-4 pt-5 pb-2.5; title 13.5/20.25 #a3a3a3;
   right cluster gap-0.5 of 28px circles with 16px glyphs */
.rayhead{display:flex;align-items:center;gap:8px;flex:0 0 auto;height:62px;padding:20px 16px 10px}
.rayhead .ttl{font-size:13.5px;line-height:20.25px;color:#a3a3a3}  /* measured, not our n400 */
.ccbtn{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;color:var(--n500);transition:background-color .15s,color .15s}
.ccbtn:hover{background:rgba(0,0,0,.05);color:var(--n700)}
.ccbtn svg{width:16px;height:16px}
/* thread: .cc__scroll + .cc__scroll-content (tail-aligned, pb-8) */
.raybody{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.chat{display:flex;flex-direction:column;flex:1 0 auto;justify-content:flex-end;min-height:100%;padding-bottom:8px}
/* .cc__msg-pad, side-peek value: 14px 18px - that padding IS the rhythm (28px between turns) */
.ccpad{padding:14px 18px}
/* .cc__day-divider: 11px muted, gap-12, hairlines both sides */
.ccday{display:flex;align-items:center;gap:12px;padding:10px 18px 0;font-size:11px;color:#9a8f84}
.ccday::before,.ccday::after{content:"";flex:1 1 auto;height:1px;background:rgba(70,60,45,.08)}
.ccday span{flex:0 0 auto}
/* .cc-msg: user = fit-content pushed right, assistant = full width left */
.msg{position:relative;display:flex;flex-direction:column;min-width:0;max-width:95%}
.msg.u{width:fit-content;margin-left:auto}
.msg.a{margin-right:auto}
.msg .time{position:absolute;top:-15px;left:0;font-size:11px;line-height:16.5px;color:#9a8f84;
  opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .14s}
.msg.u .time{left:auto;right:0}
.msg:hover .time{opacity:1}
.msg .parts{display:flex;flex-direction:column;gap:8px;min-width:0}
.msg.u .parts{background:rgba(70,60,45,.03);border:1px solid rgba(70,60,45,.10);border-radius:18px;
  padding:10px 15px;box-shadow:0 10px 24px rgba(15,23,42,.08),inset 0 1px 0 rgba(255,255,255,.05)}
/* hover actions: 24px r=6 buttons, gap-2, margin 4px -6px 0, opacity 0 -> 1 on the message */
.msg .acts{display:flex;align-items:center;gap:2px;margin:4px -6px 0;opacity:0;transition:opacity .15s}
.msg.u .acts{justify-content:flex-end;margin-top:2px}
.msg:hover .acts{opacity:1}
.actbtn{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;color:rgba(154,143,132,.75);
  transition:background-color .15s,color .15s,border-color .15s}
.actbtn:hover{background:rgba(70,60,45,.03);border-color:rgba(70,60,45,.08);color:#9a8f84}
.actbtn:active{color:#7a6f64;transform:scale(.92)}
.actbtn svg{width:14px;height:14px}
/* .cc-md, side-peek: 0.875rem / 1.65, warm near-black; block margin .9rem */
.cc-md{font-size:14px;line-height:1.65;color:#3f342c}
.cc-md p{margin:0 0 .9rem}
.cc-md > :last-child{margin-bottom:0}
 /* the principle card: a left stroke inside the radius, the corpus number as an uppercase
   label, the title, and the favourite toggle. Clicking it opens the excerpt in column 3. */
.pcard{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--panel-border);
  border-radius:var(--r-md);padding:11px 13px 11px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04);
  cursor:pointer;transition:box-shadow .15s,border-color .15s}
.pcard:hover{border-color:rgba(0,0,0,.12);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.pcard .top{display:flex;align-items:flex-start;gap:8px}
.pcard .lbl{flex:1;min-width:0;font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--n500);line-height:1.4}
.pcard .ttl{font-size:13.5px;line-height:1.5;color:var(--text);margin-top:5px}
.fav{width:22px;height:22px;flex:0 0 22px;margin:-3px -3px 0 0;border-radius:6px;color:var(--n400);
  display:flex;align-items:center;justify-content:center;transition:background-color .15s,color .15s}
.fav:hover{background:var(--row-hover);color:var(--n700)}
.fav.on{color:var(--accent)}
/* a favourited principle in column 1: number + its title, in the Eden row rhythm */
.prow{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 8px;border-radius:var(--r-md);
  font-size:14px;color:var(--n600);cursor:pointer;transition:background-color .15s,color .15s}
.prow:hover{background:var(--row-hover);color:var(--n900)}
.prow.on{background:var(--row-on);color:var(--n900)}
.prow .pn{flex:0 0 auto;font-size:12px;color:var(--n400);font-variant-numeric:tabular-nums}
.prow .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 /* the excerpt opens in a popover pinned to whatever was clicked, so the reading
   happens next to the click and not across the window */
.pop{position:fixed;z-index:50;width:360px;padding:14px 16px;background:var(--card);
  border:1px solid var(--panel-border);border-radius:var(--r-md);
  box-shadow:0 22px 60px rgba(0,0,0,.16),0 2px 8px rgba(0,0,0,.06)}
.pop::before{content:"";position:absolute;left:-6px;top:var(--arrow,22px);width:11px;height:11px;
  background:var(--card);border-left:1px solid var(--panel-border);
  border-bottom:1px solid var(--panel-border);transform:rotate(45deg)}
.pop.flip::before{left:auto;right:-6px;border-left:0;border-bottom:0;
  border-right:1px solid var(--panel-border);border-top:1px solid var(--panel-border)}
.exc .lbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
.exc .h{font-size:16px;line-height:1.4;font-weight:500;margin:7px 0 12px}
.exc .q{position:relative;font-size:13.5px;line-height:1.7;color:var(--text-2);font-style:italic;
  padding-left:12px;border-left:3px solid var(--accent)}
.exc .foot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:12px;
  border-top:1px solid var(--n200)}
.exc .src{font-size:11px;color:var(--n400);margin-top:14px}
.books{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;flex:0 0 auto;
  border-radius:999px;font-size:12px;color:var(--n700);background:rgba(255,255,255,.8);
  border:1px solid rgba(0,0,0,.07);transition:background-color .15s,color .15s,border-color .15s}
.books:hover{background:#fff;border-color:rgba(0,0,0,.12);color:var(--n900)}
/* the principle card inside an assistant turn: our left stroke and favourite toggle, but
   on Eden's in-message card tokens (.cc-format-pick: r=12, bg rgba(70,60,45,.019),
   border rgba(70,60,45,.08), question 15/500) */
.pcard.cc{background:rgba(70,60,45,.019);border-color:rgba(70,60,45,.08);border-radius:12px;
  padding:14px 16px 14px 19px;box-shadow:none}
.pcard.cc:hover{background:rgba(70,60,45,.03);border-color:rgba(70,60,45,.16);box-shadow:none}
.pcard.cc .lbl{font-size:11px;font-weight:500;letter-spacing:.06em;color:#9a8f84}
.pcard.cc .ttl{font-size:15px;line-height:22.5px;font-weight:500;color:#3f342c;margin-top:6px}
.pcard.cc .exq{font-size:14px;line-height:1.65;color:#7a6f64;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard.cc .fav{color:#9a8f84}
.pcard.cc .fav:hover{background:rgba(70,60,45,.06);color:#7a6f64}
.pcard.cc .fav.on{color:var(--accent)}
/* composer: .cc__composer width calc(100% - 28px), margin 0 auto 20px, gap-4; pill r=22,
   white/60, border rgba(70,60,45,.09) -> .22 on focus; row grid 14px 12px 12px */
.ccform{flex:0 0 auto;width:calc(100% - 28px);margin:0 auto 20px;display:flex;flex-direction:column;gap:4px}
.ccpill{border:1px solid rgba(70,60,45,.09);background:rgba(255,255,255,.6);border-radius:22px;
  display:flex;flex-direction:column;cursor:text;transition:border-color .2s}
.ccpill:hover,.ccpill:focus-within{border-color:rgba(70,60,45,.22)}
.ccrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-areas:"text text text" "left . right";align-items:center;gap:6px 8px;padding:14px 12px 12px}
.ccrow .txt{grid-area:text;min-height:36px;padding:0 6px;display:flex;align-items:flex-start;
  font-size:15px;line-height:1.35;color:#9a8f84}
.ccrow .l{grid-area:left;display:flex;align-items:center;gap:8px}
.ccrow .r{grid-area:right;display:flex;align-items:center;gap:8px}

  justify-content:center;color:#7a6f64}

.ccsend{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:rgba(0,0,0,.05);color:var(--n500);
  display:inline-flex;align-items:center;justify-content:center}
.ccsend svg{width:16px;height:16px}

/* ============================ responsive ============================
   Under 1100px column 3 slides away behind a toggle; under 900px column 1 does too.
   Both become overlays on the canvas, so column 2 always keeps the full remaining width. */
@media (max-width:1199px){
  /* a narrow header trades the long date and the subtitle for room to breathe */
  .dayhead{padding:12px 14px 9px;gap:10px}
  .dayhead .h1{font-size:17px}
  .axis button{font-size:11.5px;padding:5px 10px}
}
@media (max-width:1099px){
  .col3{position:absolute;right:8px;top:8px;bottom:8px;z-index:40;
    box-shadow:0 22px 60px rgba(0,0,0,.14),var(--sb-shadow);
    transform:translateX(calc(100% + 16px));transition:transform .18s ease}
  .app.c3open .col3{transform:none}
  .app.c3open .rayfab{right:calc(var(--c3w) + 28px)}
  .app.c3open .raypanel{right:calc(var(--c3w) + 28px)}
  .panetog.t3{display:flex}
}
@media (max-width:899px){
  .col1{position:absolute;left:8px;top:8px;bottom:8px;z-index:41;
    box-shadow:0 22px 60px rgba(0,0,0,.14),var(--sb-shadow);
    transform:translateX(calc(-100% - 16px));transition:transform .18s ease}
  .app.c1open .col1{transform:none}
  .panetog.t1{display:flex}
}
@media (max-width:1099px) and (max-height:700px){
  .raypanel{height:min(420px,calc(100vh - 40px))}
}

<body>
<div class="app">
  <aside class="col1" id="col1"></aside>
  <main class="col2" id="col2"></main>
  <aside class="col3" id="col3"></aside>
</div>
<div id="menuhost"></div>
<div id="pophost"></div>

<script>
// ============================ prototype constants ============================
const V = 'A';                 // which variant this file is
const HOUR = 52;             // px per hour on the grid
const SNAP = 15;                   // minutes: everything snaps to quarter hours
const GUT = 56;                    // px: hour-label gutter
const TODAY = '2026-08-17';        // Monday - fixed so screenshots are reproducible
const NOW = 10 * 60 + 24;          // fixed "now" (10:24) for the red line
const DS = 7, DE = 22, FOLD = 26;  // variant B: working window + folded band height
const WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MON = ['January','February','March','April','May','June','July','August',
             'September','October','November','December'];
const noRepeat = () => ({mode:'none', days:[1,1,1,1,1,0,0], weekday:0});
const svg = d => '<svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const ICON_CAL = svg('<rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.4h12M5.5 2v2.2M10.5 2v2.2"/>');
const BOOKMARK_D = '<path d="M4 2.4h8a1 1 0 0 1 1 1v10.2L8 10.9l-5 2.7V3.4a1 1 0 0 1 1-1z"/>';
const ICON_MARK = svg(BOOKMARK_D);
const ICON_MARK_ON = '<svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linejoin="round">' + BOOKMARK_D + '</svg>';
// panel-right = dock into column 3; the arrow out = float free again
const ICON_DOCK = svg('<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M10 3v10"/>');
const ICON_FLOAT = svg('<rect x="2" y="6" width="8" height="7" rx="1.6"/><path d="M6.5 3h6.5v6.5"/>');
const ICON_PANEL_L = svg('<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M6 3v10"/>');
const ICON_PANEL_R = svg('<rect x="2" y="3" width="12" height="10" rx="2"/><path d="M10 3v10"/>');
const ICON_BOOK = svg('<path d="M2.6 3.2h3.2c1 0 1.9.5 2.2 1.3c.3-.8 1.2-1.3 2.2-1.3h3.2v8.6h-3.2c-1 0-1.9.5-2.2 1.3c-.3-.8-1.2-1.3-2.2-1.3H2.6z"/><path d="M8 4.5v8.4"/>');
const ICON_CHAT = svg('<path d="M2.6 4.4a1.7 1.7 0 0 1 1.7-1.7h7.4a1.7 1.7 0 0 1 1.7 1.7v4.4a1.7 1.7 0 0 1-1.7 1.7H6.4L3.6 13v-2.5a1.7 1.7 0 0 1-1-1.7z"/>');
// chat-pane glyphs: Eden's message actions (Copy / Edit / Save as document / Regenerate)
// and its composer trio (+ / dictation / send)
const ICON_COPY = svg('<rect x="5.6" y="5.6" width="7.8" height="7.8" rx="1.6"/>' +
  '<path d="M10.4 3.4a1.6 1.6 0 0 0-1.6-1.6H4.2a1.6 1.6 0 0 0-1.6 1.6v4.6a1.6 1.6 0 0 0 1.6 1.6"/>');
const ICON_EDIT = svg('<path d="M11.2 2.6a1.5 1.5 0 0 1 2.2 2.1L6.6 11.5l-2.9.8.8-2.9z"/>');
const ICON_SAVEDOC = svg('<path d="M3.4 2.6h6.2L13 6v7.4H3.4z"/><path d="M5.6 8.4h4.8M5.6 10.8h3.2"/>');
const ICON_REGEN = svg('<path d="M13 8a5 5 0 1 1-1.6-3.6"/><path d="M13.2 2.4v2.9h-2.9"/>');
const ICON_PLUS = svg('<path d="M8 3.4v9.2M3.4 8h9.2"/>');
const ICON_CLOSE = svg('<path d="M4 4l8 8M12 4l-8 8"/>');
const ICON_MIC = svg('<rect x="6.2" y="2.2" width="3.6" height="7" rx="1.8"/><path d="M4 7.6a4 4 0 0 0 8 0"/>' +
  '<path d="M8 11.6v2.2"/>');
const ICON_SEND = svg('<path d="M8 12.8V3.6M4.2 7.2 8 3.4l3.8 3.8"/>');
// only ids live in this file - every title and excerpt is read from the local corpus at runtime
const PRINCIPLES = ['life:1.7', 'life:5.3', 'life:5.6', 'work:3.3', 'work:9.2'];
const CATS = [
  {id:'c1', name:'Learning', color:'#39624d'},
  {id:'c2', name:'Work',     color:'#4f6b7a'},
  {id:'c3', name:'Health',   color:'#a35d3d'},
  {id:'c4', name:'Family',   color:'#6a4c7a'},
];

// ============================ sample state ============================
let S = {
  axis:'day', date:TODAY, month:'2026-08',
  pane:'day', sel:null, expanded:false, toast:'',
  col1:'calendar',        // 'calendar' = categories + mini month, 'principles' = favourites
  favs:['life:5.3', 'life:5.6', 'work:3.3'],   // favourited principles, newest kept in order
  pod:'life:5.3',         // the principle of the day
  exc:null,               // {id, sel, rect} - the principle popover and what it is pinned to
  ray:false,              // is the Ask Ray chat open
  rayMode:'float',        // 'float' = panel over the grid, 'sidebar' = chat takes column 3;
                          // whichever was used last is what the bubble reopens
  ordering:false,         // dots are draggable while ordering the day
  off:[],                 // categories unticked in column 1 - their tasks are filtered out
  catsOpen:true,          // the Categories section can be collapsed like a macOS sidebar group
  rename:null,            // id of the category being renamed in place
  menu:null,              // {id, x, y, sub} - the open context menu
  c1Open:false, c3Open:false,   // side panels as overlays, under the responsive breakpoints
  closed:false,           // the day has been closed at least once
  tasks:[
    {id:'t1', title:'Morning run', cat:'c3', must:false, done:false, start:7*60,  dur:45,
     repeat:{mode:'weekdays', days:[1,1,1,1,1,0,0], weekday:0}, note:''},
    {id:'t2', title:'Decide M4 scope for VessaStudio', cat:'c2', must:true, done:false, start:9*60, dur:90,
     repeat:noRepeat(), note:'Bring the two options and the cost of each.'},
    {id:'t3', title:'English - 30 min', cat:'c1', must:true, done:true, start:11*60, dur:30,
     repeat:{mode:'daily', days:[1,1,1,1,1,0,0], weekday:0}, note:''},
    {id:'t4', title:'Review 4 LearnEnglish findings', cat:'c1', must:false, done:false, start:14*60, dur:60,
     repeat:noRepeat(), note:''},
    {id:'t5', title:'Dinner with family', cat:'c4', must:true, done:false, start:19*60, dur:60,
     repeat:noRepeat(), note:''},
    {id:'t6', title:'Fix tax paperwork', cat:'c2', must:true, done:false, start:null, dur:60,
     repeat:noRepeat(), note:''},
    {id:'t7', title:'Buy groceries', cat:'c3', must:false, done:false, start:null, dur:60,
     repeat:noRepeat(), note:''},
  ],
  backlog:[
    {id:'b1', title:'Re-read Dalio chapter 5',     cat:'c1', must:false, done:false, start:null, dur:60, repeat:noRepeat(), note:''},
    {id:'b2', title:'Call the doctor',             cat:'c3', must:true,  done:false, start:null, dur:30, repeat:noRepeat(), note:''},
    {id:'b3', title:'Try the new Principle build', cat:'c2', must:true,  done:false, start:null, dur:60, repeat:noRepeat(), note:''},
    {id:'b4', title:'Weekend walk with family',    cat:'c4', must:false, done:false, start:null, dur:90, repeat:noRepeat(), note:''},
  ],
  // an outcome that was never on the list - seeded, now that the log bar is gone
  logs:[{id:'g1', title:'Unblocked Ha on the API', cat:'c2'}],
  order:['t3','g1'],   // dot ids, best -> worst
};
let seq = 100;
let focusTitle = false;   // the next render puts the cursor in the title field
const uid = () => 'x' + (++seq);

// ============================ helpers ============================
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat = id => CATS.find(c => c.id === id) || CATS[0];
const task = id => S.tasks.find(t => t.id === id) || S.backlog.find(t => t.id === id);
const pad2 = n => String(n).padStart(2, '0');
const fmt = m => pad2(Math.floor(m/60)) + ':' + pad2(m % 60);
const isToday = () => S.date === TODAY;
// column 2's header is narrow whenever the window is - matches the 1200px breakpoint below
const narrowHead = () => window.matchMedia('(max-width:1199px)').matches;
const rgba = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n>>16 & 255) + ',' + (n>>8 & 255) + ',' + (n & 255) + ',' + a + ')';
};
const catOn = id => !S.off.includes(id);
// only the seeded day carries data - every other date is deliberately empty;
// unticked categories are filtered out everywhere the day is drawn
const dayTasks = () => (isToday() ? S.tasks : []).filter(t => catOn(t.cat));
const timed   = () => dayTasks().filter(t => t.start !== null);
const untimed = () => dayTasks().filter(t => t.start === null);
const allDots = () => (isToday()
  ? S.tasks.filter(t => t.done).map(t => ({id:t.id, title:t.title, cat:t.cat})).concat(S.logs)
  : []);
const dots = () => allDots().filter(d => catOn(d.cat));
// rank is kept against every dot, so hiding a category and showing it again
// puts its dot back where it was rather than at the bottom
function syncOrder(){
  const ids = allDots().map(d => d.id);
  S.order = S.order.filter(i => ids.includes(i)).concat(ids.filter(i => !S.order.includes(i)));
}
const orderedDots = () => { syncOrder(); const m = dots(); return S.order.map(i => m.find(d => d.id === i)).filter(Boolean); };

// ---------- geometry: minutes <-> pixels ----------
const folded = () => false;
function yOf(m){
  if (!folded()) return m / 60 * HOUR;
  if (m < DS*60)  return m / (DS*60) * FOLD;
  if (m > DE*60)  return FOLD + (DE-DS)*HOUR + (m - DE*60) / ((24-DE)*60) * FOLD;
  return FOLD + (m - DS*60) / 60 * HOUR;
}
function mOf(y){
  if (!folded()) return y / HOUR * 60;
  const top = FOLD, bot = FOLD + (DE-DS)*HOUR;
  if (y < top) return y / FOLD * (DS*60);
  if (y > bot) return DE*60 + (y - bot) / FOLD * ((24-DE)*60);
  return DS*60 + (y - top) / HOUR * 60;
}
const gridH = () => folded() ? FOLD*2 + (DE-DS)*HOUR : 24*HOUR;
const snapM = m => Math.round(m / SNAP) * SNAP;
function clampStart(m, dur){
  const lo = folded() ? DS*60 : 0, hi = (folded() ? DE*60 : 1440) - dur;
  return Math.max(lo, Math.min(hi, m));
}

// ---------- overlap: split a cluster of overlapping blocks into columns ----------
function layout(list){
  const sorted = list.slice().sort((a,b) => a.start - b.start || a.dur - b.dur);
  const out = new Map();
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    if (!cluster.length) return;
    const cols = [];
    cluster.forEach(t => {
      let i = 0;
      while (i < cols.length && cols[i] > t.start) i++;
      if (i === cols.length) cols.push(0);
      cols[i] = t.start + t.dur;
      out.set(t.id, {col:i, n:0});
    });
    cluster.forEach(t => out.get(t.id).n = cols.length);
    cluster = []; clusterEnd = -1;
  };
  sorted.forEach(t => {
    if (cluster.length && t.start >= clusterEnd) flush();
    cluster.push(t);
    clusterEnd = Math.max(clusterEnd, t.start + t.dur);
  });
  flush();
  return out;
}

// ============================ actions ============================
const A = {
  axis(k){ S.axis = k; render(); },
  pickDate(d){ S.date = d; S.pane = 'day'; S.sel = null; render(); },
  today(){ S.date = TODAY; S.month = TODAY.slice(0,7); S.pane = 'day'; render(); },
  shiftDay(n){
    const d = new Date(S.date + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
    S.date = d.toISOString().slice(0,10); S.month = S.date.slice(0,7); S.pane = 'day'; S.sel = null; render();
  },
  shiftMonth(n){
    const [y, m] = S.month.split('-').map(Number);
    const d = new Date(Date.UTC(y, m - 1 + n, 1));
    S.month = d.toISOString().slice(0,7); render();
  },
  col1Mode(k){ S.col1 = k; render(); },
  // the detail pane lives in column 3, so a chat docked there floats itself out of the way
  freeCol3(){ if (raySidebar()) S.rayMode = 'float'; },
  // the excerpt opens beside whatever was clicked; column 3 is left alone.
  // `where` is a place token ('pod' | 'row' | 'ray'), not a selector - a selector would carry
  // double quotes into the inline onclick attribute and break it
  openExcerpt(id, where){ S.exc = {id:id, where:where, rect:null}; render(); },
  closeExcerpt(){ if (S.exc){ S.exc = null; render(); } },
  toggleFav(id){
    S.favs = S.favs.includes(id) ? S.favs.filter(x => x !== id) : S.favs.concat(id);
    render();
  },
  toggleRay(){ S.ray = !S.ray; render(); },
  rayDock(mode){ S.rayMode = mode; S.ray = true; render(); },
  open(id){ A.freeCol3(); S.sel = id; S.pane = 'detail'; render(); },
  back(){ S.pane = 'day'; S.sel = null; render(); },
  // Delete / Backspace on a selected block: the task goes and column 3 falls back to the day
  remove(id){
    S.tasks = S.tasks.filter(t => t.id !== id);
    S.backlog = S.backlog.filter(t => t.id !== id);
    S.order = S.order.filter(x => x !== id);
    if (S.sel === id){ S.sel = null; S.pane = 'day'; }
    render();
  },
  toggleDone(id){ const t = task(id); if (t) { t.done = !t.done; S.toast = ''; } render(); },
  create(start, dur){
    const t = {id:uid(), title:'New task', cat:'c2', must:false, done:false, start, dur,
               repeat:noRepeat(), note:''};
    S.tasks.push(t); A.open(t.id);
  },
  // "+" in column 3's header: the detail pane opens on a task that has nothing in it yet -
  // empty title with the cursor already in it, all-day until a time is picked. Only the
  // seeded day carries data in this prototype, so the new task lands there.
  newTask(){
    const t = {id:uid(), title:'', cat:'c2', must:false, done:false, start:null, dur:60,
               repeat:noRepeat(), note:''};
    S.tasks.push(t); S.date = TODAY; focusTitle = true; A.open(t.id);
  },
  // clicking a suggestion pulls it into today's all-day strip
  pull(id){
    const i = S.backlog.findIndex(b => b.id === id); if (i < 0) return;
    const t = S.backlog.splice(i, 1)[0]; t.start = null;
    S.tasks.push(t); S.date = TODAY; render();
  },
  setTitle(id, v){ task(id).title = v; },
  setNote(id, v){ task(id).note = v; },
  setCat(id, v){ task(id).cat = v; render(); },
  setMust(id, v){ task(id).must = v; render(); },
  setStart(id, v){ task(id).start = v === '' ? null : +v; render(); },
  setDur(id, v){ task(id).dur = +v; render(); },
  setRepeat(id, v){ task(id).repeat.mode = v; render(); },
  toggleDay(id, i){ const r = task(id).repeat; r.days[i] = r.days[i] ? 0 : 1; render(); },
  setWeekday(id, i){ task(id).repeat.weekday = +i; render(); },
  toggleFold(){ S.expanded = !S.expanded; render(); },
  toggleCat(id){ S.off = catOn(id) ? S.off.concat(id) : S.off.filter(x => x !== id); render(); },
  toggleCats(){ S.catsOpen = !S.catsOpen; render(); },
  // "+" on the Categories header: the new category lands at the end of the list already in
  // its rename box, the way a new calendar does in Calendar.app
  addCat(){
    const id = uid();
    CATS.push({id:id, name:'New category', color:SWATCHES[CATS.length % SWATCHES.length]});
    S.catsOpen = true; S.menu = null; S.rename = id; render();
  },
  togglePane(which){ if (which === 1) S.c1Open = !S.c1Open; else S.c3Open = !S.c3Open; render(); },
  // ---- macOS-style context menu on a category ----
  catMenu(e, id){ e.preventDefault(); S.menu = {id, x:e.clientX, y:e.clientY, sub:false}; render(); },
  closeMenu(){ if (S.menu || S.rename !== null){ S.menu = null; S.rename = null; render(); } },
  menuColors(){ S.menu.sub = true; render(); },
  catOnly(id){ S.off = CATS.filter(c => c.id !== id).map(c => c.id); S.menu = null; render(); },
  catRename(id){ S.rename = id; S.menu = null; render(); },
  catRenamed(id, v){
    if (S.rename === null) return;
    const t = String(v).trim(); if (t) cat(id).name = t;
    S.rename = null; render();
  },
  catColor(id, color){ cat(id).color = color; S.menu = null; render(); },
  catDelete(id){
    // like deleting a calendar in Calendar.app: the category and its items go together
    const i = CATS.findIndex(c => c.id === id); if (i < 0 || CATS.length === 1) return;
    CATS.splice(i, 1);
    S.tasks = S.tasks.filter(t => t.cat !== id);
    S.backlog = S.backlog.filter(t => t.cat !== id);
    S.logs = S.logs.filter(l => l.cat !== id);
    S.off = S.off.filter(x => x !== id);
    S.menu = null; render();
  },
  startOrder(){ S.ordering = true; S.toast = ''; render(); },
  closeDay(){
    const n = orderedDots().length; if (!n) return;
    S.ordering = false; S.closed = true;
    S.toast = 'Day closed - ' + n + (n === 1 ? ' dot' : ' dots') + ' recorded, best to worst.';
    render();
  },
  // ranking drag (column 3)
  dstart(e, id){ e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; },
  dover(e, id){ e.preventDefault(); e.currentTarget.classList.add('over'); },
  dleave(e){ e.currentTarget.classList.remove('over'); },
  ddrop(e, id){
    e.preventDefault(); e.currentTarget.classList.remove('over');
    const from = e.dataTransfer.getData('text/plain'); if (!from || from === id) return;
    syncOrder();
    S.order.splice(S.order.indexOf(from), 1);
    S.order.splice(S.order.indexOf(id), 0, from);
    render();
  },
};

// ============================ column 1 ============================
function miniMonth(){
  const [y, m] = S.month.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1));
  const lead = (first.getUTCDay() + 6) % 7;                 // Monday-first
  const cells = [];
  for (let i = 0; i < 42; i++){
    const d = new Date(Date.UTC(y, m - 1, 1 - lead + i));
    const key = d.toISOString().slice(0,10);
    const out = d.getUTCMonth() !== m - 1;
    cells.push('<div class="d ' + (out ? 'out ' : '') + (key === TODAY ? 'today ' : '') +
      (key === S.date ? 'sel' : '') + '" onclick="A.pickDate(\'' + key + '\')">' + d.getUTCDate() + '</div>');
  }
  return '<div class="mini">' +
    '<div class="mhead"><span>' + MON[m-1] + ' ' + y + '</span><span class="sp"></span>' +
      '<button class="mnav" onclick="A.shiftMonth(-1)">&#8249;</button>' +
      '<button class="mnav" onclick="A.shiftMonth(1)">&#8250;</button></div>' +
    '<div class="mgrid">' + WD.map(d => '<div class="wd">' + d[0] + '</div>').join('') +
      cells.join('') + '</div></div>';
}
function renderCol1(){
  // one row per category: tick it to show that category on the grid, untick it to hide it,
  // right-click it for the menu. Renaming happens in the row itself, as it does on macOS.
  const catBlock = c => {
    const box = '<span class="cb' + (catOn(c.id) ? ' on' : '') + '" style="color:' + c.color + '"' +
      ' onclick="event.stopPropagation();A.toggleCat(\'' + c.id + '\')"></span>';
    if (S.rename === c.id)
      return '<div class="catrow" oncontextmenu="A.catMenu(event,\'' + c.id + '\')">' + box +
        '<input type="text" value="' + esc(c.name) + '"' +
        ' onblur="A.catRenamed(\'' + c.id + '\',this.value)"' +
        ' onkeydown="if(event.key===\'Enter\')this.blur();' +
                   'if(event.key===\'Escape\'){A.closeMenu();}"></div>';
    return '<div class="catrow' + (catOn(c.id) ? '' : ' off') + '"' +
      ' onclick="A.toggleCat(\'' + c.id + '\')" oncontextmenu="A.catMenu(event,\'' + c.id + '\')"' +
      ' title="' + (catOn(c.id) ? 'Hide' : 'Show') + ' ' + esc(c.name) + '">' + box +
      esc(c.name) + '</div>';
  };

  const modes =
    '<div class="modes">' +
      '<button class="' + (S.col1 === 'calendar' ? 'on' : '') + '" title="Calendar"' +
        ' onclick="A.col1Mode(\'calendar\')">' + ICON_CAL + '</button>' +
      '<button class="' + (S.col1 === 'principles' ? 'on' : '') + '" title="Principles"' +
        ' onclick="A.col1Mode(\'principles\')">' + ICON_MARK + '</button>' +
    '</div>';

  const calendarMode =
    '<div class="sechead disc' + (S.catsOpen ? '' : ' shut') + '" onclick="A.toggleCats()">' +
      'Categories<span class="sp"></span>' +
      '<button class="ctl plus" title="New category"' +
        ' onclick="event.stopPropagation();A.addCat()">+</button>' +
      '<span class="ctl chev' + (S.catsOpen ? '' : ' shut') + '" title="' +
        (S.catsOpen ? 'Hide' : 'Show') + '">&#9660;</span></div>' +
    (S.catsOpen ? '<div class="sblist">' + CATS.map(catBlock).join('') + '</div>' : '') +
    miniMonth();

  // the principle of the day rides at the top of the Inbox list
  // the bookmark mode: the principle of the day, then the favourites by kind.
  // No backlog here - the backlog is column 3's "Backlog" section only.
  const group = (kind, label) => {
    const rows = S.favs.filter(id => id.split(':')[0] === kind);
    if (!rows.length) return '';
    return '<div class="sechead">' + label + '</div>' +
      '<div class="sblist">' + rows.map(principleRow).join('') + '</div>';
  };
  const favMode =
    '<div class="sechead">Principle of the day</div>' +
    '<div class="pod">' + principleCard(S.pod, 'pod') + '</div>' +
    group('life', 'Life principles') + group('work', 'Work principles') +
    (S.favs.length ? '' : '<div class="note" style="padding:6px 20px">No favourites yet.</div>');

  const el = document.getElementById('col1');
  el.innerHTML = modes + (S.col1 === 'calendar' ? calendarMode : favMode);
  const inp = el.querySelector('.catrow input');
  if (inp){ inp.focus(); inp.select(); }
}

// the popover is pinned to its anchor's live position, so it survives re-renders; when the
// anchor disappears (unfavouriting removes its row) the last known position is kept
const excSel = e => (e.where === 'ray' ? '.raybody ' : '#col1 ') +
  (e.where === 'row' ? '.prow' : '.pcard') + '[data-pid="' + e.id + '"]';
function renderPop(){
  const host = document.getElementById('pophost');
  if (!S.exc){ host.innerHTML = ''; return; }
  const el = document.querySelector(excSel(S.exc));
  if (el) S.exc.rect = el.getBoundingClientRect();
  const r = S.exc.rect;
  if (!r){ host.innerHTML = ''; return; }
  const W = 360, GAP = 12;
  const toRight = r.right + GAP + W <= window.innerWidth - 8;
  const left = toRight ? r.right + GAP : Math.max(8, r.left - GAP - W);
  host.innerHTML = '<div class="pop' + (toRight ? '' : ' flip') + '" style="left:' +
    Math.round(left) + 'px;top:0">' + excerptBody(S.exc.id) + '</div>';
  const pop = host.firstElementChild;
  const h = pop.getBoundingClientRect().height;
  const top = Math.max(8, Math.min(r.top - 10, window.innerHeight - h - 8));
  pop.style.top = Math.round(top) + 'px';
  pop.style.setProperty('--arrow', Math.round(Math.max(14, Math.min(r.top + r.height / 2 - top, h - 20))) + 'px');
}

// ============================ column 2 ============================
function blockHtml(t, pos){
  const c = cat(t.cat);
  const top = yOf(t.start), h = Math.max(16, yOf(t.start + t.dur) - top - 2);
  const w = 100 / pos.n, left = pos.col * w;
  const sel = S.sel === t.id && S.pane === 'detail';
  // both rings are inset, so neither can be clipped: the selection stroke rides on top of
  // the tint outline a "nice to" block already carries
  const rings = [sel ? 'inset 0 0 0 2px var(--btn)' : '',
                 t.must ? '' : 'inset 0 0 0 1px ' + rgba(c.color, .34)].filter(Boolean);
  const style = (t.must ? 'background:' + c.color + ';color:#fff;'
                        : 'background:' + rgba(c.color, .18) + ';color:var(--text);') +
    (rings.length ? 'box-shadow:' + rings.join(',') + ';' : '');
  return '<div class="blk ' + (t.done ? 'done ' : '') + (sel ? 'sel' : '') +
    '" data-id="' + t.id + '" style="top:' + top + 'px;height:' + h + 'px;left:calc(' + left + '% + 4px);' +
      'width:calc(' + w + '% - 8px);' + style + '">' +
    '<div class="r1"><span class="cb ' + (t.done ? 'on' : '') + '" data-tid="' + t.id + '"></span>' +
      '<span class="t">' + esc(t.title || 'New task') + '</span></div>' +
    (h >= 34 ? '<div class="tm">' + fmt(t.start) + ' - ' + fmt(t.start + t.dur) + '</div>' : '') +
    '<div class="rz"></div></div>';
}
function gridHtml(){
  const list = timed();
  const pos = layout(list);
  let out = '';
  for (let h = 0; h <= 24; h++){
    out += '<div class="hr" style="top:' + (h * HOUR) + 'px"></div>';
    if (h < 24) out += '<div class="hlab" style="top:' + (h * HOUR) + 'px">' + pad2(h) + '</div>';
  }
  out += '<div id="lane">' + list.map(t => blockHtml(t, pos.get(t.id))).join('') +
         '<div class="ghost" id="ghost"></div></div>';
  if (isToday() && (!folded() || (NOW >= DS*60 && NOW <= DE*60)))
    out += '<div class="nowline" style="top:' + yOf(NOW) + 'px"></div>';
  return '<div class="grid" style="height:' + gridH() + 'px">' + out + '</div>';
}
function alldayHtml(){
  const list = untimed();
  if (!list.length) return '<div class="adempty">Nothing without a time.</div>';
  return list.map(t => {
    const c = cat(t.cat);
    const style = t.must
      ? 'background:' + c.color + ';color:#fff;'
      : 'background:' + rgba(c.color, .18) + ';color:var(--text);box-shadow:inset 0 0 0 1px ' + rgba(c.color, .34) + ';';
    return '<span class="adit ' + (t.done ? 'done' : '') + '" data-id="' + t.id + '" style="' + style + '">' +
      '<span class="cb ' + (t.done ? 'on' : '') + '" data-tid="' + t.id + '"></span>' +
      '<span class="t">' + esc(t.title || 'New task') + '</span></span>';
  }).join('');
}

function dayPane(){
  const ranked = orderedDots();
  let out = '';
  if (ranked.length){
    const dot = o => '<span class="dot2" style="background:' + cat(o.cat).color + '" title="' +
      esc(o.title) + '">' + cat(o.cat).name[0] + '</span>';
    // static: Dalio's one-day column, nothing but the dots
    const column = S.ordering
      ? '<div class="dotcol ord">' + ranked.map(o =>
          '<div class="drow" draggable="true" ondragstart="A.dstart(event,\'' + o.id + '\')" ' +
            'ondragover="A.dover(event,\'' + o.id + '\')" ondragleave="A.dleave(event)" ' +
            'ondrop="A.ddrop(event,\'' + o.id + '\')">' + dot(o) +
            '<span class="t">' + esc(o.title) + '</span></div>').join('') +
          '<div class="dothint">Drag the best to the top.</div></div>'
      : '<div class="dotcol">' + ranked.map(dot).join('') + '</div>';
    const action = S.ordering
      ? '<button class="btn primary wide" onclick="A.closeDay()">Close day</button>'
      : '<button class="btn wide" onclick="A.startOrder()">' +
        (S.closed ? 'Reorder' : 'Order the day') + '</button>';
    out += '<div class="sec"><div class="h">Today\'s dots</div>' + column + action +
      (S.toast ? '<div class="note" style="margin-top:8px;color:var(--olive)">' + esc(S.toast) + '</div>' : '') +
      '</div>';
  }
  // the backlog reads in two groups, must first; an empty group is left out entirely
  const bRow = b => '<div class="sugrow" onclick="A.pull(\'' + b.id + '\')">' +
    '<span class="tick" style="background:' + cat(b.cat).color + '"></span>' +
    '<span class="t">' + esc(b.title) + '</span><span class="add">+ Today</span></div>';
  const bGroup = (label, list) => list.length
    ? '<div class="grph">' + label + '</div>' + list.map(bRow).join('') : '';
  out += '<div class="sec"><div class="h">Backlog</div>' +
    (S.backlog.length
      ? bGroup('Must do', S.backlog.filter(b => b.must)) +
        bGroup('Like to do', S.backlog.filter(b => !b.must))
      : '<div class="note">Backlog is empty.</div>') +
    '</div>';
  if (!ranked.length)
    out += '<div class="note">Dots appear once something is done.</div>';
  return out;
}

// one principle card for both places it appears; only the corpus id ever lives in this
// file - the excerpt itself is read from the local corpus at runtime
const PLABEL = id => { const [k, n] = id.split(':');
  return (k === 'work' ? 'Work' : 'Life').toUpperCase() + ' PRINCIPLE ' + n; };
const isFav = id => S.favs.includes(id);
const favBtn = id => '<button class="fav' + (isFav(id) ? ' on' : '') + '"' +
  ' title="' + (isFav(id) ? 'Remove from favourites' : 'Add to favourites') + '"' +
  ' onclick="event.stopPropagation();A.toggleFav(\'' + id + '\')">' +
  (isFav(id) ? ICON_MARK_ON : ICON_MARK) + '</button>';
// the card carries label + title + favourite only; the excerpt and the book live in column 3
function principleCard(id, where){
  const inChat = where === 'ray';
  return '<div class="pcard' + (inChat ? ' cc' : '') + '" data-pid="' + id +
      '" onclick="A.openExcerpt(\'' + id + '\',\'' + (where || 'pod') + '\')">' +
      '<div class="top"><span class="lbl">' + esc(PLABEL(id)) + '</span>' + favBtn(id) + '</div>' +
      '<div class="ttl">[principle title loads from the local corpus at runtime]</div>' +
      (inChat ? '<div class="exq">[the first two lines of the book excerpt are read from the ' +
        'local corpus at runtime - the translation is copyrighted and is never stored here]</div>' : '') +
    '</div>';
}
function principleRow(id){
  return '<div class="prow' + (S.exc && S.exc.id === id && S.exc.where === 'row' ? ' on' : '') + '"' +
      ' data-pid="' + id + '" onclick="A.openExcerpt(\'' + id + '\',\'row\')">' +
      '<span class="pn">' + esc(id.split(':')[1]) + '</span>' +
      '<span class="t">[title loads from the local corpus]</span>' +
    '</div>';
}
// a short book excerpt, shown in a popover beside the card or row that was clicked
function excerptBody(id){
  return '<div class="exc">' +
      '<div class="lbl">' + esc(PLABEL(id)) + '</div>' +
      '<div class="h">[principle title loads from the local corpus at runtime]</div>' +
      '<div class="q">[the book excerpt for this principle is read from the local corpus at ' +
        'runtime - the translation is copyrighted and is never stored in this file]</div>' +
      '<div class="src">Principles, Ray Dalio</div>' +
      '<div class="foot">' +
        '<button class="books" onclick="A.toggleFav(\'' + id + '\')">' +
          (isFav(id) ? ICON_MARK_ON : ICON_MARK) + (isFav(id) ? 'Favorited' : 'Favorite') + '</button>' +
        '<button class="books" title="Opens Apple Books at this page">' + ICON_BOOK + 'Open in Books</button>' +
      '</div>' +
    '</div>';
}
// one turn: the timestamp and the action row appear on hover, exactly as Eden does it
const actBtn = (icon, label) => '<button class="actbtn" title="' + label + '">' + icon + '</button>';
function ccMsg(kind, time, parts, acts){
  return '<div class="ccpad"><div class="msg ' + kind + '">' +
      '<time class="time">' + time + '</time>' +
      '<div class="parts">' + parts + '</div>' +
      '<div class="acts">' + acts + '</div>' +
    '</div></div>';
}
function chatThread(){
  return '<div class="chat">' +
    '<div class="ccday"><span>Today</span></div>' +
    ccMsg('u', '10:24 AM',
      '<div class="cc-md"><p>I have seven things on today and I already know I cannot do them all. ' +
        'Which one do I drop?</p></div>',
      actBtn(ICON_COPY, 'Copy') + actBtn(ICON_EDIT, 'Edit message')) +
    ccMsg('a', '10:24 AM',
      principleCard('life:5.6', 'ray') +
      '<div class="cc-md"><p>Drop the one whose expected value is lowest, not the one that feels ' +
        'heaviest. Tax paperwork costs you an hour today and nothing if it slips a week. The M4 ' +
        'scope decision blocks two people tomorrow morning.</p>' +
        '<p>Keep the M4 block where it is. Move the paperwork to Thursday and let the groceries go ' +
        'to whoever is home first.</p></div>',
      actBtn(ICON_COPY, 'Copy') + actBtn(ICON_SAVEDOC, 'Save as document') +
      actBtn(ICON_REGEN, 'Regenerate response')) +
    '</div>';
}
function ccComposer(){
  return '<form class="ccform" onsubmit="return false">' +
    '<div class="ccpill"><div class="ccrow">' +
      '<div class="txt">Ask Ray about today</div>' +
      '<div class="l"><button class="ccbtn" title="Add context">' + ICON_PLUS + '</button></div>' +
      '<div class="r"><span class="ccmic" title="Dictate">' + ICON_MIC + '</span>' +
        '<button class="ccsend" title="Send">' + ICON_SEND + '</button></div>' +
    '</div></div></form>';
}
// the thread scrolls, the composer does not - they are siblings, as in Eden's pane
function chatPane(){
  return '<div class="raybody">' + chatThread() + '</div>' + ccComposer();
}
// no header any more: date navigation moved to the column-2 toolbar and Ask Ray
// floats over the grid, so column 3 is only its content
function renderCol3(){
  const el = document.getElementById('col3');
  el.className = 'col3' + (raySidebar() ? ' raycol' : '');
  const dateNav = '<div class="c3head">' +
    '<div class="nav">' +
      '<button class="navbtn" onclick="A.shiftDay(-1)" title="Previous day">&#8249;</button>' +
      '<button class="navbtn" onclick="A.today()">Today</button>' +
      '<button class="navbtn" onclick="A.shiftDay(1)" title="Next day">&#8250;</button></div>' +
    '<button class="navbtn add" title="New task" onclick="A.newTask()">' + ICON_PLUS + '</button></div>';
  el.innerHTML = raySidebar()
    ? rayHead('float', 'Float') + chatPane()
    : dateNav + '<div class="c3body">' + (S.pane === 'detail' ? detailPane() : dayPane()) + '</div>';
}

// ============================ pointer: drag / create / resize ============================
let drag = null, firstPaint = true;
const laneEl = () => document.getElementById('lane');
const laneY = e => e.clientY - laneEl().getBoundingClientRect().top;
function ghost(a, b){
  const g = document.getElementById('ghost'); if (!g) return;
  g.style.display = 'block';
  g.style.top = yOf(a) + 'px';
  g.style.height = Math.max(10, yOf(b) - yOf(a) - 2) + 'px';
  g.style.left = '4px'; g.style.right = '4px';
}
const hideGhost = () => { const g = document.getElementById('ghost'); if (g) g.style.display = 'none'; };

// a click that dismisses a menu or ends a rename must not also hit what is underneath,
// so it is swallowed on the way down - re-rendering alone would not stop it
let swallow = false;
document.addEventListener('click', e => {
  if (!swallow) return;
  swallow = false; e.stopPropagation(); e.preventDefault();
}, true);

document.addEventListener('mousedown', e => {
  swallow = false;
  // an open menu swallows the first click anywhere else, as menus do on macOS
  if (S.menu && !e.target.closest('.menu')){ e.preventDefault(); swallow = true; A.closeMenu(); return; }
  // the popover closes when you click away; clicking another principle re-anchors it instead
  if (S.exc && !e.target.closest('.pop') && !e.target.closest('.pcard') && !e.target.closest('.prow')){
    S.exc = null; render();
  }
  // at narrow widths a side panel is an overlay covering its own toggle, so it closes
  // the way a drawer does: click anywhere off it
  if (S.c3Open && !e.target.closest('#col3') && !e.target.closest('.t3')){
    e.preventDefault(); swallow = true; S.c3Open = false; render(); return;
  }
  if (S.c1Open && !e.target.closest('#col1') && !e.target.closest('.t1')){
    e.preventDefault(); swallow = true; S.c1Open = false; render(); return;
  }
  // clicking away commits the rename, the way it does in Finder; Escape cancels it
  if (S.rename !== null && !e.target.closest('.catrow')){
    const i = document.querySelector('.catrow input'); if (i) i.blur();
    swallow = true; return;
  }
  const cb = e.target.closest('.cb[data-tid]');
  if (cb){ e.preventDefault(); A.toggleDone(cb.dataset.tid); return; }
  const ad = e.target.closest('.adit');
  if (ad){ e.preventDefault(); drag = {mode:'allday', id:ad.dataset.id, y0:e.clientY, x0:e.clientX, moved:false}; return; }
  const blk = e.target.closest('.blk');
  if (blk){
    e.preventDefault();
    const t = task(blk.dataset.id);
    drag = {mode: e.target.classList.contains('rz') ? 'resize' : 'move', id:t.id, el:blk,
            y0:e.clientY, x0:e.clientX, start0:t.start, dur0:t.dur, moved:false};
    return;
  }
  if (e.target.closest('#lane')){
    e.preventDefault();
    const m = clampStart(snapM(mOf(laneY(e))), SNAP);
    drag = {mode:'create', m0:m, m1:m, y0:e.clientY, x0:e.clientX, moved:false};
    ghost(m, m + SNAP);
  }
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  const dy = e.clientY - drag.y0;
  if (Math.abs(dy) > 3 || Math.abs(e.clientX - drag.x0) > 3) drag.moved = true;
  if (drag.mode === 'move'){
    const s = clampStart(snapM(mOf(yOf(drag.start0) + dy)), drag.dur0);
    drag.cur = s;
    drag.el.style.top = yOf(s) + 'px';
    drag.el.style.height = Math.max(16, yOf(s + drag.dur0) - yOf(s) - 2) + 'px';
  } else if (drag.mode === 'resize'){
    const end = Math.max(drag.start0 + SNAP,
      Math.min(folded() ? DE*60 : 1440, snapM(mOf(yOf(drag.start0 + drag.dur0) + dy))));
    drag.curEnd = end;
    drag.el.style.height = Math.max(16, yOf(end) - yOf(drag.start0) - 2) + 'px';
  } else if (drag.mode === 'create'){
    drag.m1 = clampStart(snapM(mOf(laneY(e))), SNAP);
    const a = Math.min(drag.m0, drag.m1), b = Math.max(drag.m0, drag.m1);
    ghost(a, Math.max(b, a + SNAP));
  } else if (drag.mode === 'allday'){
    if (!drag.moved) return;
    const r = laneEl().getBoundingClientRect();
    if (e.clientY > r.top && e.clientY < r.bottom && e.clientX > r.left){
      drag.drop = clampStart(snapM(e.clientY - r.top < 0 ? 0 : mOf(e.clientY - r.top)), 60);
      ghost(drag.drop, drag.drop + 60);
    } else { drag.drop = null; hideGhost(); }
  }
});
document.addEventListener('mouseup', () => {
  if (!drag) return;
  const d = drag; drag = null; hideGhost();
  if (d.mode === 'move'){
    if (!d.moved) A.open(d.id);
    else { task(d.id).start = d.cur; render(); }
  } else if (d.mode === 'resize'){
    if (d.moved) task(d.id).dur = d.curEnd - task(d.id).start;
    render();
  } else if (d.mode === 'create'){
    const a = Math.min(d.m0, d.m1), b = Math.max(d.m0, d.m1);
    if (d.moved && b - a >= SNAP) A.create(a, b - a); else render();
  } else if (d.mode === 'allday'){
    if (!d.moved) A.open(d.id);
    else if (d.drop != null){ const t = task(d.id); t.start = d.drop; t.dur = 60; render(); }
    else render();
  }
});

document.addEventListener('keydown', e => {
  // Delete / Backspace removes the selected block, as it does in Calendar.app - but never
  // while a field has the cursor, where the same key is only editing text
  if (e.key === 'Delete' || e.key === 'Backspace'){
    const f = document.activeElement;
    const typing = f && (f.tagName === 'INPUT' || f.tagName === 'TEXTAREA' || f.isContentEditable);
    if (typing || S.menu || S.rename !== null || S.exc) return;
    if (S.sel && task(S.sel)){ e.preventDefault(); A.remove(S.sel); }
    return;
  }
  if (e.key !== 'Escape') return;
  if (S.menu || S.rename !== null){ A.closeMenu(); return; }
  if (S.exc){ A.closeExcerpt(); return; }
  if (S.c3Open || S.c1Open){ S.c3Open = S.c1Open = false; render(); }
});

// ============================ render ============================
function render(){
  const app = document.querySelector('.app');
  app.className = 'app' + (S.c1Open ? ' c1open' : '') + (S.c3Open ? ' c3open' : '');
  const w = document.getElementById('gridwrap');
  const keep = w ? w.scrollTop : null;
  renderCol1(); renderCol2(); renderCol3(); renderMenu(); renderPop();
  const nw = document.getElementById('gridwrap');
  if (nw){
    // first paint lands on the morning, like Apple Calendar does;
    // when the night hours are folded the whole day already fits, so start at the top
    const start = folded() ? 0 : Math.max(0, yOf(6 * 60) - 8);
    nw.scrollTop = firstPaint ? start : (keep === null ? 0 : keep);
  }
  // the chat opens on its newest turn, like every chat pane does
  const thread = document.querySelector('.raybody');
  if (thread) thread.scrollTop = thread.scrollHeight;
  // a task made with "+" opens with the cursor already in its title
  if (focusTitle){
    const f = document.getElementById('titlefld');
    if (f){ f.focus(); f.select(); }
    focusTitle = false;
  }
  firstPaint = false;
}
// a panel left open as an overlay must not stay "open" once it is docked again
const MQW = window.matchMedia('(max-width:1199px)');   // narrow header: short date, no subtitle
const MQ3 = window.matchMedia('(max-width:1099px)');
const MQ1 = window.matchMedia('(max-width:899px)');
const syncPanes = () => {
  let changed = false;
  if (!MQ3.matches && S.c3Open){ S.c3Open = false; changed = true; }
  if (!MQ1.matches && S.c1Open){ S.c1Open = false; changed = true; }
  if (changed) render();
};
MQ3.addEventListener('change', syncPanes);
MQ1.addEventListener('change', syncPanes);
MQW.addEventListener('change', render);
window.addEventListener('resize', () => { if (S.exc) renderPop(); });

render();
</script>

<script src="./proto-comments.js"></script>
